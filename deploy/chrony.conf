# Proxmox VE Host chrony.conf
# Uses Heltec Wireless Tracker v1.1 as primary Stratum 1 time source.

# ==============================================================================
# Time Sources
# ==============================================================================

# Preferred local Stratum 1 GPS NTP Appliance (Heltec Wireless Tracker v1.1)
# Note: Update IP address if you changed CONFIG_NTP_STATIC_IP in sdkconfig
server 192.168.1.200 iburst prefer minpoll 3 maxpoll 4

# Fallback Public Internet NTP Pools (used automatically if GNSS lock is lost)
pool time.cloudflare.com iburst minpoll 6 maxpoll 10
pool 2.debian.pool.ntp.org iburst minpoll 6 maxpoll 10

# ==============================================================================
# Disciplining & Stepping Rules
# ==============================================================================

# Allow chrony to step the clock (rather than slew) if offset > 1.0s during first 3 updates
makestep 1.0 3

# Keep kernel Real-Time Clock (RTC) in sync with system time
rtcsync

# Record rate at which system clock gains/losses time
driftfile /var/lib/chrony/chrony.drift

# ==============================================================================
# Logging
# ==============================================================================
logdir /var/log/chrony
log measurements statistics tracking
