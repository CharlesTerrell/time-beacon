name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  schedule:
    # Nightly build at 06:00 UTC (midnight MST)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  host-tests:
    name: Native Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run host test suite
        run: ./tests/run_tests.sh

  check-nightly-needed:
    name: Check Nightly Commit Activity
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Determine if build is required
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Checking commits in last 24h via GitHub API..."
            COMMITS_COUNT=$(curl -s -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits?since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=1" \
              | jq '. | length')

            if [ "$COMMITS_COUNT" -gt 0 ]; then
              echo "Found $COMMITS_COUNT new commit(s) in the last 24 hours. Proceeding with nightly build."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "No commits found in the last 24 hours. Skipping scheduled build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Manual dispatch or release tag detected. Proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Push or PR event: host tests only. Firmware build skipped."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-firmware:
    name: Build ESP32-S3 Targets
    needs: [host-tests, check-nightly-needed]
    if: needs.check-nightly-needed.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe directory for git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true

      - name: Build firmware targets (v1.1 & v2)
        run: |
          . ${IDF_PATH}/export.sh
          ./build.sh all

      - name: Archive firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: time-beacon-firmware
          path: |
            build_v1/time-beacon-heltec-tracker-v1.1.bin
            build_v2/time-beacon-heltec-tracker-v2.bin
            build_v1/heltec-tracker-ntp.bin
            build_v2/heltec-tracker-ntp.bin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Time Beacon (Nightly Build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            build_v1/time-beacon-heltec-tracker-v1.1.bin
            build_v2/time-beacon-heltec-tracker-v2.bin

      - name: Prepare Web Installer Directory
        run: |
          mkdir -p web
          cp build_v1/time-beacon-heltec-tracker-v1.1.bin web/
          cp build_v2/time-beacon-heltec-tracker-v2.bin web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy-pages:
    name: Deploy Web Installer to GitHub Pages
    needs: build-firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
