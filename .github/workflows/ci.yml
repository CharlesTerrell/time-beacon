name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  host-tests:
    name: Native Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run host test suite
        run: ./tests/run_tests.sh

  build-firmware:
    name: Build ESP32-S3 Targets
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe directory for git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true

      - name: Build firmware targets (v1.1 & v2)
        run: |
          . ${IDF_PATH}/export.sh
          ./build.sh all

      - name: Archive firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: time-beacon-firmware
          path: |
            build_v1/time-beacon-heltec-tracker-v1.1.bin
            build_v2/time-beacon-heltec-tracker-v2.bin
            build_v1/heltec-tracker-ntp.bin
            build_v2/heltec-tracker-ntp.bin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Time Beacon (Latest Build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            build_v1/time-beacon-heltec-tracker-v1.1.bin
            build_v2/time-beacon-heltec-tracker-v2.bin

      - name: Prepare Web Installer Directory
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p web
          cp build_v1/time-beacon-heltec-tracker-v1.1.bin web/
          cp build_v2/time-beacon-heltec-tracker-v2.bin web/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy-pages:
    name: Deploy Web Installer to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build-firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
